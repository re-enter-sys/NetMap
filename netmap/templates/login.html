<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NetMap Login</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    color: #fff;
    font-family: Arial, sans-serif;
}

.login {
    width: 360px;
    padding: 35px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 16px;
    background: #0d1117;
    color: white;
    border: 1px solid #30363d;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
}

.error {
    padding: 10px;
    margin-bottom: 15px;
    background: #3b1111;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="login">

<h1>NetMap</h1>
<p>Security Operations Dashboard</p>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="POST">

<label>Username</label>

<input
    type="text"
    name="username"
    required
>

<label>Password</label>

<input
    type="password"
    name="password"
    required
>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
